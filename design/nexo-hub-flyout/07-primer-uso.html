<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo · Primer uso / First launch</title><style>
:root{color-scheme:dark;--color-bg-canvas:#141518;--color-surface-0:#141518;--color-surface-1:#1B1C20;--color-surface-2:#232428;--color-surface-3:#2D2E33;--color-surface-overlay:rgba(35,36,40,.84);--color-fg-default:#FFFFFF;--color-fg-secondary:#CCCCCC;--color-fg-muted:#A1A2A8;--color-border-control:#7A7B81;--color-border-hairline:rgba(255,255,255,.08);--color-border-hairline-strong:rgba(255,255,255,.14);--color-primitive-red-neon:#FF0036;--color-primitive-red-dark:#CC002B;--color-action-primary-solid-fg:#000000;--font-sans:system-ui,sans-serif;--font-display:"Arial Narrow",sans-serif;--gradient-sheen:linear-gradient(180deg,rgba(255,255,255,.045) 0%,rgba(255,255,255,0) 42%);--gradient-btn-primary:linear-gradient(180deg,#FF2D57 0%,#FF0036 52%,#EE0031 100%);--shadow-edge:inset 0 1px 0 rgba(255,255,255,.07);--shadow-edge-strong:inset 0 1px 0 rgba(255,255,255,.13);--shadow-elev-3:0 4px 10px rgba(0,0,0,.7),0 28px 70px -10px rgba(0,0,0,.9);--shadow-btn-primary:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.6),0 8px 22px -8px rgba(255,0,54,.7);--shadow-focus:0 0 0 2px #141518,0 0 0 4px #FF0036;--blur-overlay:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--color-fg-default);font:500 12.8px/1.6 var(--font-sans)}body{min-height:100vh;background:var(--gradient-sheen),var(--color-bg-canvas);overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--shadow-focus)}[hidden]{display:none!important}.wallpaper{position:fixed;inset:0;overflow:hidden;pointer-events:none}.wallpaper:before,.wallpaper:after{content:"";position:absolute;border-radius:9999px;background:var(--color-surface-2);opacity:.45;transform:rotate(-35deg)}.wallpaper:before{width:900px;height:300px;left:-230px;top:80px}.wallpaper:after{width:760px;height:250px;left:150px;bottom:130px;background:var(--color-surface-3);opacity:.30}.taskbar{position:fixed;inset:auto 0 0;height:51.2px;background:var(--color-surface-overlay);backdrop-filter:blur(var(--blur-overlay)) saturate(150%);border-top:1px solid var(--color-border-hairline-strong);display:flex;justify-content:center;align-items:center}.task-center{display:flex;align-items:center;gap:19.2px;color:var(--color-fg-secondary);font-size:19.2px}.win{display:grid;grid-template-columns:repeat(2,6.4px);grid-template-rows:repeat(2,6.4px);gap:1px}.win i{background:var(--color-fg-secondary)}.task-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:9.6px;background:var(--color-surface-3);font:700 12.8px/1 var(--font-sans)}.tray{position:absolute;right:12.8px;display:flex;align-items:center;gap:9.6px;color:var(--color-fg-secondary);font-size:11.2px}.tray-button,.icon-button{display:grid;place-items:center;width:38.4px;height:38.4px;border-radius:9.6px;border:1px solid var(--color-border-control);background:var(--color-surface-2);color:var(--color-fg-default);font-size:16px;line-height:1}.tray-button{background:var(--color-surface-3)}.tray-button[aria-expanded=false]{background:var(--color-surface-1)}.mark{display:grid;place-items:center;width:19.2px;height:19.2px;flex:none;border-radius:3.2px;background:var(--color-primitive-red-neon);color:var(--color-action-primary-solid-fg);font:800 12.8px/1 var(--font-sans)}.clock{text-align:right;line-height:1.2}.flyout{position:fixed;z-index:2;right:12.8px;top:12.8px;bottom:64px;width:min(600px,calc(100vw - 25.6px));resize:none;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--color-border-hairline-strong);border-radius:17.6px;background:var(--color-surface-overlay);backdrop-filter:blur(var(--blur-overlay)) saturate(150%);box-shadow:var(--shadow-edge-strong),var(--shadow-elev-3)}.panel-head{flex:none;display:flex;align-items:center;gap:9.6px;padding:16px 19.2px;border-bottom:1px solid var(--color-border-hairline);background:var(--gradient-sheen)}.panel-head strong{flex:1;font:700 16px/1.2 var(--font-sans)}.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:19.2px}.scroll:focus-visible{outline:2px solid var(--color-primitive-red-neon);outline-offset:-3.2px}.kicker{font:700 11.2px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--color-fg-secondary)}h1{font:700 19.2px/1.2 var(--font-sans);margin:6.4px 0}p{color:var(--color-fg-secondary);margin:0 0 12.8px}.lang-en{display:block;color:var(--color-fg-secondary)}fieldset{border:0;margin:16px 0;padding:0}legend{font-weight:700;margin-bottom:9.6px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9.6px}.choice{display:flex;align-items:flex-start;gap:9.6px;min-width:0;padding:12.8px;border:1px solid var(--color-border-control);border-radius:12.8px;background:var(--gradient-sheen),var(--color-surface-1);box-shadow:var(--shadow-edge);cursor:pointer}.choice:has(input:checked){background:var(--color-surface-3);border-color:var(--color-fg-default)}.choice input{margin:3.2px 0 0;width:19.2px;height:19.2px;flex:none;accent-color:var(--color-primitive-red-neon)}.choice strong{display:block;font:700 16px/1.2 var(--font-sans)}.choice small{display:block;color:var(--color-fg-secondary);font-size:11.2px;margin-top:6.4px}.btn{min-height:38.4px;padding:9.6px 16px;border:1px solid var(--color-primitive-red-dark);border-radius:9.6px;background:var(--gradient-btn-primary);color:var(--color-action-primary-solid-fg);box-shadow:var(--shadow-btn-primary);font:700 12.8px/1.2 var(--font-sans)}.hint,.foot{font-size:11.2px;color:var(--color-fg-secondary)}.foot{margin:12.8px 0 0}.feedback{margin:12.8px 0 0;padding:9.6px 12.8px;border:1px solid var(--color-border-control);border-radius:9.6px;background:var(--color-surface-1);color:var(--color-fg-default)}@media(max-width:650px){.flyout{right:6.4px;width:calc(100vw - 12.8px)}.task-center{display:none}.panel-head,.scroll{padding-left:12.8px;padding-right:12.8px}}@media(max-width:380px){.choices{grid-template-columns:1fr}}@media(prefers-reduced-transparency:reduce){.flyout,.taskbar{background:var(--color-surface-2);backdrop-filter:none}}@supports not (backdrop-filter:blur(20px)){.flyout,.taskbar{background:var(--color-surface-2)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main aria-label="Escritorio de Windows"><div class="wallpaper" aria-hidden="true"></div></main><footer class="taskbar" aria-label="Barra de tareas de Windows"><div class="task-center" aria-hidden="true"><span class="win"><i></i><i></i><i></i><i></i></span><span>⌕</span><span class="task-icon">▣</span><span class="task-icon">▤</span></div><div class="tray"><span aria-hidden="true">⌃　◈　▰　ES</span><button class="tray-button" id="tray" type="button" aria-label="Panel de Nexo / Nexo panel" aria-controls="flyout" aria-expanded="true"><span class="mark" aria-hidden="true">N</span></button><span class="clock" aria-hidden="true">17:42<br>13/11/2026</span></div></footer>
<aside class="flyout" id="flyout" role="dialog" aria-modal="false" aria-labelledby="panel-title" tabindex="-1"><header class="panel-head"><span class="mark" aria-hidden="true">N</span><strong>Nexo</strong><button class="icon-button" id="close" type="button" aria-label="Cerrar panel / Close panel">×</button></header><div class="scroll" tabindex="0" aria-label="Elegir idioma / Choose a language"><span class="kicker">Primer uso · <span lang="en">First launch</span></span><h1 id="panel-title">Elige tu idioma <span class="lang-en" lang="en">Choose your language</span></h1><p>Puedes cambiarlo después en Ajustes.<br><span lang="en">You can change it later in Settings.</span></p><fieldset><legend>Idioma / <span lang="en">Language</span></legend><div class="choices"><label class="choice" lang="es"><input type="radio" name="locale" value="es" checked><span><strong>Español</strong><small>Usar Nexo en español</small></span></label><label class="choice" lang="en"><input type="radio" name="locale" value="en"><span><strong>English</strong><small>Use Nexo in English</small></span></label></div></fieldset><button class="btn" id="continue" type="button">Continuar</button><p class="feedback" id="feedback" role="status" hidden></p><p class="foot">Selección de muestra · <span lang="en">Example selection</span></p></div></aside>
<script>
const panel=document.getElementById('flyout'),tray=document.getElementById('tray'),button=document.getElementById('continue'),feedback=document.getElementById('feedback');function closePanel(restore){panel.hidden=true;tray.setAttribute('aria-expanded','false');if(restore)tray.focus()}function openPanel(){panel.hidden=false;tray.setAttribute('aria-expanded','true');document.querySelector('[name=locale]:checked').focus({preventScroll:true})}tray.addEventListener('click',()=>panel.hidden?openPanel():closePanel(true));document.getElementById('close').addEventListener('click',()=>closePanel(true));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!panel.hidden){event.preventDefault();closePanel(true)}});document.addEventListener('pointerdown',event=>{if(!panel.hidden&&!panel.contains(event.target)&&!tray.contains(event.target))closePanel(false)});document.querySelectorAll('[name=locale]').forEach(input=>input.addEventListener('change',()=>{button.textContent=input.value==='es'?'Continuar':'Continue';button.lang=input.value;feedback.hidden=true}));button.addEventListener('click',()=>{const en=document.querySelector('[name=locale]:checked').value==='en';feedback.lang=en?'en':'es';feedback.textContent=en?'Example: English selected. Next, your apps would appear.':'Ejemplo: Español seleccionado. Después aparecerían tus aplicaciones.';feedback.hidden=false});
</script></body></html>
