[package]
name = "nexo-hub"
version = "0.1.0"
description = "Nexo hub"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nexo_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexo-catalog = { path = "../../../crates/nexo-catalog" }
nexo-protocol = { path = "../../../crates/nexo-protocol" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Tauri's effect helper does not report whether the OS applied the backdrop.
window-vibrancy = "0.8.1"
