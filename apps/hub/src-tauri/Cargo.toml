[package]
name = "nexo-hub"
version = "0.2.0"
description = "Nexo hub"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nexo_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
minisign-verify = "0.3"
nexo-catalog = { path = "../../../crates/nexo-catalog" }
nexo-protocol = { git = "https://github.com/egdev6/tauri-plugin-nexo", tag = "v0.1.1" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-nexo = { git = "https://github.com/egdev6/tauri-plugin-nexo", tag = "v0.1.1" }
tokio = { version = "1", features = ["net"] }
windows-sys = { version = "0.61", features = ["Wdk_System_Registry", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
windows-numerics = "=0.3.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Graphics_Effects", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Foundation", "System", "UI_Composition", "UI_Composition_Desktop",
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_WinRT",
    "Win32_System_WinRT_Composition", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
