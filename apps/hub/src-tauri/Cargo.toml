[package]
name = "nexo-hub"
version = "0.1.0"
description = "Nexo hub"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nexo_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
minisign-verify = "0.3"
nexo-catalog = { path = "../../../crates/nexo-catalog" }
nexo-protocol = { path = "../../../crates/nexo-protocol" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-nexo = { path = "../../../crates/tauri-plugin-nexo" }
tokio = { version = "1", features = ["net"] }
windows-sys = { version = "0.61", features = ["Wdk_System_Registry", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
# Tauri's effect helper does not report whether the OS applied the backdrop.
window-vibrancy = "0.8.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
